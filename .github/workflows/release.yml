name: Release

# Publishing a version: bump "version" in package.json, commit, then push a tag such as v2.0.1.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      # Trusted publishing (OIDC) needs a recent npm CLI.
      - run: npm install -g npm@11

      - run: npm test

      - name: Pack and checksum
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist && sha256sum *.tgz > SHA256SUMS

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  # Optional mirror in GitHub Packages. It runs only after the npm release succeeded, so a failure
  # here never affects the npm package. GitHub Packages requires a scoped name (@owner/name).
  github-packages:
    name: Publish to GitHub Packages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@wildkodokushi'
      - name: Scope the package name for GitHub Packages
        run: npm pkg set name=@wildkodokushi/ai-git-flow
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
